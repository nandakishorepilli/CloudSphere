<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Sphere | Students</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/admin.css"><link rel="stylesheet" href="/static/modal.css"></head>
<body><main class="admin-shell"><header class="admin-header"><img class="admin-logo" src="/static/cloud-sphere-logo.png" alt="Cloud Sphere logo"><div><p class="eyebrow">ADMINISTRATION</p><h1>Student Management</h1></div><div class="admin-header-actions"><a class="secondary-button" href="/admin">← Dashboard</a><a class="secondary-button" href="/admin/attendance">Attendance</a></div></header><section class="panel"><div class="panel-heading"><div><h3>Students</h3><p>Search, view, and edit student records.</p></div><button class="primary-button" id="add">+ Add student</button></div><div class="table-controls"><input id="name" placeholder="Student name"><input id="roll" placeholder="Roll number"><select id="filterCourse"><option value="">All courses</option></select><button class="secondary-button" id="search">Search</button><button class="secondary-button" id="clear">Clear</button></div><div class="table-wrap"><table><thead><tr><th>Name / account</th><th>Roll no.</th><th>Course</th><th>Contact</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty-state" hidden>No students match these filters.</div></section></main><div class="modal-backdrop" id="modal" hidden><div class="modal"><div class="modal-header"><h2 id="title">Add student</h2><button class="close-button" id="close" type="button">×</button></div><form id="form"><div class="form-grid"><label>Name<input name="full_name" required></label><label>Roll number<input name="roll_number" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" required></label><label>Course<select name="course_id" id="course" required></select></label><label>Department<input name="department" required></label><label>Year<select name="year"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label></div><p class="form-error" id="error" hidden></p><div class="modal-actions"><button class="secondary-button" type="button" id="cancel">Cancel</button><button class="primary-button">Save student</button></div></form></div></div><script src="/static/script.js"></script></body></html>
