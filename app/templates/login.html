<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cloud Sphere | Login</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/auth.css"></head><body class="auth-page"><main class="auth-card"><img class="auth-logo" src="/static/cloud-sphere-logo.png" alt="Cloud Sphere"><p class="eyebrow">COLLEGE DATA PLATFORM</p><h1>Welcome back</h1><p class="auth-copy">Sign in to the Cloud Sphere workspace.</p><div class="role-tabs"><button class="role-tab active" data-role="admin">Admin Login</button><button class="role-tab" data-role="user">User Login</button></div><form id="otpForm"><label>Email<input id="email" type="email" required placeholder="you@college.edu"></label><div id="codeGroup" hidden><label>One-time code<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code"></label></div><p id="authMessage" class="auth-message" hidden></p><button class="primary-button" id="submitButton" type="submit">Generate OTP</button></form><p class="auth-note">Accounts are created by an administrator. No public registration is available.</p></main><script src="/static/auth.js"></script></body></html>
