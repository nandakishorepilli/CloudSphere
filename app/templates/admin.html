<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Sphere | Admin</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/admin.css"></head><body><main class="admin-shell"><header class="admin-header"><img class="admin-logo" src="/static/cloud-sphere-logo.png" alt="Cloud Sphere logo"><div><p class="eyebrow">ADMINISTRATION</p><h1>Admin Dashboard</h1></div><div class="admin-header-actions"><a href="/admin/students" class="secondary-button">Students</a><a href="/admin/attendance" class="secondary-button">Attendance</a><a href="/admin/activity" class="secondary-button">View Activity →</a><button id="logout" class="secondary-button">Log out</button></div></header><section class="stats-grid"><article class="stat-card"><div><p>Total students</p><strong id="students">—</strong></div></article><article class="stat-card"><div><p>Approved courses</p><strong id="courses">—</strong></div></article><article class="stat-card"><div><p>Attendance records</p><strong id="records">—</strong></div></article></section><section class="panel"><div class="panel-heading"><div><h3>User management</h3><p>Create and manage student login accounts.</p></div></div><form id="addUser" class="add-user"><input name="full_name" required placeholder="Full name"><input name="email" type="email" required placeholder="email@college.edu"><button class="primary-button">Add user</button></form><p id="userError" class="form-error" hidden></p><div class="table-wrap"><table><thead><tr><th>User</th><th>Status</th><th>Last login</th></tr></thead><tbody id="users"></tbody></table></div></section></main><script src="/static/admin.js"></script></body></html>
