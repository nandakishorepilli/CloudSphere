<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cloud Sphere | Admin</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/admin.css"></head><body><main class="admin-shell"><header class="admin-header"><img src="/static/cloud-sphere-logo.png" alt="Cloud Sphere"><div><p class="eyebrow">ADMINISTRATION</p><h1>Admin Dashboard</h1></div><button id="logout" class="secondary-button">Log out</button></header><section class="stats-grid"><article class="stat-card"><div><p>Total users</p><strong id="total">—</strong></div></article><article class="stat-card"><div><p>Active users</p><strong id="active">—</strong></div></article><article class="stat-card"><div><p>Inactive users</p><strong id="inactive">—</strong></div></article></section><section class="admin-grid"><article class="panel"><div class="panel-heading"><div><h3>User management</h3><p>Create and manage client accounts.</p></div></div><form id="addUser" class="add-user"><input name="full_name" required minlength="2" placeholder="Full name"><input name="email" type="email" required placeholder="email@college.edu"><button class="primary-button">Add user</button></form><p id="userError" class="form-error" hidden></p><div class="table-wrap"><table><thead><tr><th>User</th><th>Status</th><th>Created</th><th>Last login</th><th></th></tr></thead><tbody id="users"></tbody></table></div></article><article class="panel"><div class="panel-heading"><div><h3>Audit activity</h3><p>Recent account and data actions.</p></div></div><div id="logs" class="log-list"></div></article></section></main><script src="/static/admin.js"></script></body></html>
